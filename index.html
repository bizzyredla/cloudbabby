<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6fed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mini CRM">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Mini CRM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Mini CRM</div>
    <nav class="tabs" id="tabs">
      <a href="#dashboard" data-view="dashboard">Dashboard</a>
      <a href="#accounts" data-view="accounts">Accounts</a>
      <a href="#planner" data-view="planner"><span class="hide-sm">Daily </span>Planner</a>
      <a href="#lists" data-view="lists">Lists</a>
    </nav>
    <div class="topbar-actions">
      <button class="btn ghost" id="btn-sync" type="button">☁ Set up sync</button>
      <button class="btn ghost" id="btn-export" title="Download a JSON backup">Export</button>
      <label class="btn ghost" title="Restore from a JSON backup">
        Import<input type="file" id="file-import" accept="application/json" hidden>
      </label>
    </div>
  </header>

  <main id="view"></main>

  <dialog id="modal">
    <form method="dialog" id="modal-form"></form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
