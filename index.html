<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111714" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mini CRM">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Mini CRM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand side-brand" href="#dashboard"><span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>mini crm<span class="brand-dot">.</span></a>
    <div class="side-label">Workspace</div>
    <nav class="tabs" id="tabs">
      <a href="#dashboard" data-view="dashboard"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Overview</span></a>
      <a href="#accounts" data-view="accounts"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M8 8h3M8 12h3M8 16h3M3 21h18"/></svg><span>Accounts</span><span class="nav-count" id="nc-accounts"></span></a>
      <a href="#contacts" data-view="contacts" class="nav-desktop"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg><span>Contacts</span><span class="nav-count due" id="nc-contacts"></span></a>
      <a href="#partners" data-view="partners" class="nav-desktop"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11l3-3a2.5 2.5 0 0 1 3.5 0L20 13.5M4 13.5L9.5 8M3 12l4.5 4.5a2 2 0 0 0 2.8 0l.7-.7M12 17l1.5 1.5a2 2 0 0 0 2.8 0L21 13.8"/></svg><span>Partners</span></a>
      <a href="#planner" data-view="planner"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span class="t-full">Daily planner</span><span class="t-short">Planner</span></a>
      <a href="#map" data-view="map"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg><span>Map</span></a>
      <a href="#lists" data-view="lists"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Lists</span></a>
      <a href="#cadences" data-view="cadences"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg><span>Cadences</span><span class="nav-count due" id="nc-cadences"></span></a>
    </nav>
    <div class="side-promo">
      <div class="side-promo-ic" aria-hidden="true">✦</div>
      <strong>Small steps. Stronger connections.</strong>
      <p>Your next great relationship starts with a follow-up.</p>
      <a href="#planner">Plan your day <span aria-hidden="true">↗</span></a>
    </div>
    <div class="side-foot">
      <button type="button" class="side-link" id="btn-settings-side"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>Settings</button>
      <div class="side-status" id="side-status"><i></i><span>Saved on this device</span></div>
    </div>
  </aside>

  <header class="topbar">
    <a class="brand top-brand" href="#dashboard"><span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>mini crm<span class="brand-dot">.</span></a>
    <div class="crumbs"><span>Workspace</span><span class="sep">/</span><strong id="crumb-page">Overview</strong></div>
    <div class="topbar-actions">
      <button class="search-box" id="btn-search" type="button" title="Search (press /)" aria-label="Search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span class="sb-text">Search anything…</span><kbd class="sb-kbd">⌘K</kbd></button>
      <button class="btn ghost icon-only ask-btn" id="btn-ask" type="button" title="Ask Claude: research companies and contacts" aria-label="Ask Claude"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></button>
      <button class="btn ghost" id="btn-sync" type="button">☁ Set up sync</button>
      <button class="btn ghost icon-only" id="btn-settings" type="button" title="Settings" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button>
    </div>
    <input type="file" id="file-import" accept="application/json" hidden>
    <input type="file" id="csv-import" accept=".csv,text/csv,.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  </header>
  <div id="sync-banner" class="sync-banner" hidden></div>

  <main id="view"></main>

  <dialog id="modal">
    <form method="dialog" id="modal-form"></form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/supabase/supabase.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      // When a new version installs, reload once so updates show on the first launch.
      const hadController = !!navigator.serviceWorker.controller;
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadController && !reloading) { reloading = true; location.reload(); }
      });
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
